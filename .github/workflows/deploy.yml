name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Which environment(s) to deploy
        type: choice
        options: [both, staging, production]
        default: both

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    environment: release
    env:
      TARGET: ${{ inputs.target || 'both' }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: echo "present=$([ -f worker/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.present != 'true'
        run: echo "No worker/ in this ref; nothing to deploy."
      - if: steps.check.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.check.outputs.present == 'true'
        working-directory: worker
        run: npm ci
      - name: Deploy staging (devnet)
        if: steps.check.outputs.present == 'true' && env.TARGET != 'production'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: |
            d1 migrations apply pokerbots-staging --env staging --remote
            deploy --env staging
      - name: Deploy production (mainnet)
        if: steps.check.outputs.present == 'true' && env.TARGET != 'staging'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: |
            d1 migrations apply pokerbots-production --env production --remote
            deploy --env production
      - name: Deploy site
        if: env.TARGET != 'staging'
        run: cp cli/src/pokerbots_cli/docs.md site/llms.txt
      - if: env.TARGET != 'staging'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.155.0
          workingDirectory: site
          command: deploy
